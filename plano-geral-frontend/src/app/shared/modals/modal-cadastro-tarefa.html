<div class="modal-body px-5">
  <div class="title py-4 fw-bold">
    <h3 class="fw-bold text-secondary">
      Cadastrar tarefa
    </h3>
  </div>

  <form>
    <div class="catalog-selection-row mb-3">
      <div class="catalog-selection-card">
        <label for="componente" class="fw-bold text-secondary">Componente</label>
        <select
          class="form-select"
          id="componente"
          [(ngModel)]="componenteSelecionado"
          name="componente"
          [disabled]="carregandoTitulos || componentes.length === 0"
          (ngModelChange)="onComponenteChange()"
        >
          <option value="">
            {{ carregandoTitulos ? 'Carregando componentes...' : 'Selecione um componente' }}
          </option>
          <option *ngFor="let componente of componentes" [value]="componente">
            {{ componente }}
          </option>
        </select>
        <small class="text-danger d-block mt-1" *ngIf="erroTitulos">
          {{ erroTitulos }}
        </small>
      </div>

      <div class="catalog-selection-card">
        <label for="atividadePrincipal" class="fw-bold text-secondary">
          Atividade principal
        </label>
        <select
          class="form-select"
          id="atividadePrincipal"
          [(ngModel)]="atividadePrincipalSelecionada"
          name="atividadePrincipal"
          [disabled]="!componenteSelecionado"
          (ngModelChange)="onAtividadePrincipalChange()"
        >
          <option value="">Selecione uma atividade</option>
          <option *ngFor="let atividade of atividadesPrincipais" [value]="atividade">
            {{ atividade }}
          </option>
        </select>
      </div>

      <div
        class="catalog-selection-card"
        *ngIf="deveSelecionarSubatividade()"
      >
        <label for="subatividade" class="fw-bold text-secondary">
          Subatividade
        </label>

        <select
          class="form-select"
          id="subatividade"
          [(ngModel)]="subatividadeSelecionada"
          name="subatividade"
          (ngModelChange)="onSubatividadeChange()"
        >
          <option value="">Selecione uma subatividade</option>
          <option *ngFor="let item of subatividades" [value]="item.subatividade">
            {{ item.subatividade }}
          </option>
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label for="titulo" class="fw-bold text-secondary">
        {{ devePreencherTituloManual() ? 'Título' : 'Título gerado' }}
      </label>
      <input
        type="text"
        class="form-control"
        id="titulo"
        [(ngModel)]="titulo"
        name="titulo"
        [readonly]="!devePreencherTituloManual()"
        [placeholder]="devePreencherTituloManual() ? 'Informe o título da tarefa' : ''"
      />

      <small class="text-muted" *ngIf="tituloCatalogoSelecionado">
        Título vinculado ao catálogo.
      </small>

      <small class="text-danger d-block mt-1" *ngIf="atividadePrincipalSelecionada && !tituloCatalogoSelecionado">
        Selecione uma opção do catálogo para salvar a tarefa.
      </small>

      <small class="text-danger d-block mt-1" *ngIf="devePreencherTituloManual() && !titulo.trim()">
        Informe um título para salvar a tarefa.
      </small>
    </div>

    <div class="mb-3">
      <select
      class="form-select"
      id="projetoId"
      [(ngModel)]="projetoId"
      name="projetoId"
      [disabled]="carregandoProjetos || projetos.length === 0"
      required
      >
        <option value="" disabled>
          {{ carregandoProjetos ? 'Carregando projetos...' : 'Selecione um projeto' }}
        </option>
        <option *ngFor="let projeto of projetos" [value]="projeto.id">
          {{ projeto.nome }}
          <ng-container *ngIf="projeto.centroCusto">
            - {{ projeto.centroCusto }}
          </ng-container>
        </option>
      </select>

    </div>

    <!-- DESCRIÇÃO -->
    <div class="mb-3">
      <label for="descricao" class="fw-bold text-secondary">Descrição</label>
      <textarea
        class="form-control"
        id="descricao"
        rows="3"
        [(ngModel)]="descricao"
        name="descricao"
      ></textarea>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button
    type="button"
    class="btn btn-secondary"
    (click)="activeModal.dismiss()"
  >
    Cancelar
  </button>

  <button
    type="button"
    class="btn btn-primary"
    (click)="salvar()"
    [disabled]="!podeSalvar()"
  >
    Salvar
  </button>
</div>
