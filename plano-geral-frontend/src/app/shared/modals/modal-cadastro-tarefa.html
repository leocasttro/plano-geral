<div class="modal-body px-5">
  <div class="title py-4 fw-bold">
    <h3 class="fw-bold text-secondary">Cadastrar tarefa</h3>
  </div>

  <form>
    <div class="catalog-selection-row mb-3">
      <div class="catalog-selection-card">
        <label for="componente" class="fw-bold text-secondary"
          >Componente</label
        >
        <ng-select
          [items]="componentes"
          id="componente"
          [ngModel]="componenteSelecionado || null"
          name="componente"
          [disabled]="carregandoTitulos || componentes.length === 0"
          (ngModelChange)="onComponenteChange($event)"
          [placeholder]="carregandoTitulos ? 'Carregando componentes...' : 'Selecione um componente'"
          [searchable]="true"

        >
        </ng-select>
        <small class="text-danger d-block mt-1" *ngIf="erroTitulos">
          {{ erroTitulos }}
        </small>
      </div>

      <div class="catalog-selection-card">
        <label for="atividadePrincipal" class="fw-bold text-secondary">
          Atividade principal
        </label>
        <ng-select
          [items]="atividadesPrincipais"
          id="atividadePrincipal"
          [ngModel]="atividadePrincipalSelecionada || null"
          name="atividadePrincipal"
          [disabled]="!componenteSelecionado"
          (ngModelChange)="onAtividadePrincipalChange($event)"
          placeholder="Selecione uma atividade"
          [searchable]="true"

        >
        </ng-select>
      </div>

      <div class="catalog-selection-card" *ngIf="deveSelecionarSubatividade()">
        <label for="subatividade" class="fw-bold text-secondary">
          Subatividade
        </label>

        <ng-select
          [items]="subatividades"
          bindLabel="subatividade"
          bindValue="subatividade"
          id="subatividade"
          [ngModel]="subatividadeSelecionada || null"
          name="subatividade"
          (ngModelChange)="onSubatividadeChange($event)"
          placeholder="Selecione uma subatividade"
          [searchable]="true"
        >
        </ng-select>
      </div>
    </div>

    <div class="mb-3">
      <label for="titulo" class="fw-bold text-secondary">
        {{ devePreencherTituloManual() ? 'Título' : 'Título gerado' }}
      </label>
      <input
        type="text"
        class="form-control"
        id="titulo"
        [(ngModel)]="titulo"
        name="titulo"
        [readonly]="!devePreencherTituloManual()"
        [placeholder]="devePreencherTituloManual() ? 'Informe o título da tarefa' : ''"
      />

      <small class="text-muted" *ngIf="tituloCatalogoSelecionado">
        Título vinculado ao catálogo.
      </small>

      <small
        class="text-danger d-block mt-1"
        *ngIf="atividadePrincipalSelecionada && !tituloCatalogoSelecionado"
      >
        Selecione uma opção do catálogo para salvar a tarefa.
      </small>

      <small
        class="text-danger d-block mt-1"
        *ngIf="devePreencherTituloManual() && !titulo.trim()"
      >
        Informe um título para salvar a tarefa.
      </small>
    </div>

    <div class="mb-3">
      <label class="fw-bold text-secondary">Projeto</label>
      <ng-select
        [items]="projetos"
        bindValue="id"
        id="projetoId"
        [ngModel]="projetoId || null"
        name="projetoId"
        [disabled]="carregandoProjetos || projetos.length === 0"
        [placeholder]="carregandoProjetos ? 'Carregando projetos...' : 'Selecione um projeto'"
        [searchable]="true"
        [searchFn]="searchProjetoFn"
        (ngModelChange)="projetoId = $event ?? ''"

      >
        <ng-template ng-option-tmp let-item="item">
          {{ item.nome }} <ng-container *ngIf="item.centroCusto">- {{ item.centroCusto }}</ng-container>
        </ng-template>
        <ng-template ng-label-tmp let-item="item">
          {{ item.nome }} <ng-container *ngIf="item.centroCusto">- {{ item.centroCusto }}</ng-container>
        </ng-template>
      </ng-select>
    </div>

    <!-- DESCRIÇÃO -->
    <div class="mb-3">
      <label for="descricao" class="fw-bold text-secondary">Descrição</label>
      <textarea
        class="form-control"
        id="descricao"
        rows="3"
        [(ngModel)]="descricao"
        name="descricao"
      ></textarea>
    </div>
    <div class="form-check mt-3 mb-3">
      <input
        class="form-check-input"
        type="checkbox"
        id="checkMacro"
        name="isMacroTarefa"
        [(ngModel)]="isMacroTarefa"
      />
      <label class="form-check-label fw-bold text-primary" for="checkMacro">
        É uma Macro-Tarefa (Poderá conter sub-tarefas)
      </label>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button
    type="button"
    class="btn btn-secondary"
    (click)="activeModal.dismiss()"
  >
    Cancelar
  </button>

  <button
    type="button"
    class="btn btn-primary"
    (click)="salvar()"
    [disabled]="!podeSalvar()"
  >
    Salvar
  </button>
</div>
