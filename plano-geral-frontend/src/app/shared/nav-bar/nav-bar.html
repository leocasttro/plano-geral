<nav class="navbar bg-body-tertiary">
  <div class="container-fluid">
    <div class="wrapper d-flex justify-content-between w-100 m-3">
      <div class="titulo">
        <h4 class="fw-bolder">{{ titulo }}</h4>
        <span class="text-body-tertiary fs-6">{{ subtitulo }}</span>
      </div>

      <div class="perfil-btn">
        <button
          *ngIf="isProjetosRoute"
          class="btn btn-primary fw-bolder p-2 m-2"
          type="button"
          (click)="onNovoProjetoClick()"
        >
          <fa-icon [icon]="faPlus"></fa-icon>
          Novo projeto
        </button>
        <div class="icons d-inline-flex">
          <div class="notification-wrapper">
            <button
              type="button"
              class="nav-icon-btn notification-btn"
              (click)="toggleNotificacoes()"
              title="Notificações"
            >
              <fa-icon class="text-secondary" [icon]="faNotification" />

              <span class="notification-badge" *ngIf="totalNaoLidas > 0">
                {{ totalNaoLidas }}
              </span>
            </button>

            <div class="notification-menu" *ngIf="mostrarNotificacoes">
              <div class="notification-header">
                <div>
                  <strong>Notificações</strong>
                  <span>{{ totalNaoLidas }} não lidas</span>
                </div>

                <button
                  type="button"
                  class="notification-clear"
                  [disabled]="totalNaoLidas === 0"
                  (click)="limparNotificacoes()"
                >
                  Limpar
                </button>
              </div>

              <div class="notification-empty" *ngIf="notificacoes.length === 0">
                Nenhuma notificação.
              </div>

              <div
                class="notification-item"
                [class.unread]="!notificacao.lida"
                *ngFor="let notificacao of notificacoes"
                (click)="abrirNotificacao(notificacao)"
              >
                <strong>{{ notificacao.titulo }}</strong>
                <span>{{ notificacao.mensagem }}</span>
                <small>{{ formatarDataNotificacao(notificacao.createdAt) }}</small>
              </div>
            </div>
          </div>

          <button
            type="button"
            class="nav-icon-btn"
            [class.active]="isKanbanRoute"
            [disabled]="!isKanbanRoute"
            (click)="onSearchClick()"
            title="Pesquisar tarefas"
          >
            <fa-icon class="text-secondary" [icon]="faSearch" />
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
