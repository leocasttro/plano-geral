<section class="report-filter-panel mt-4">
  <div class="report-filter-grid">
    <label>
      <span>Projeto</span>
      <ng-select
        [items]="projetos"
        bindValue="id"
        [ngModel]="filtros.projetoId || null"
        (ngModelChange)="alterarProjeto($event ?? '')"
        placeholder="Todos os projetos"
        [clearable]="true"
        [searchable]="true"
        [searchFn]="searchProjetoFn"
      >
        <ng-template ng-option-tmp let-item="item">
          {{ projetoFiltroLabel(item) }}
        </ng-template>
        <ng-template ng-label-tmp let-item="item">
          {{ projetoFiltroLabel(item) }}
        </ng-template>
      </ng-select>
    </label>

    <label>
      <span>Usuário</span>
      <ng-select
        [items]="usuarios"
        bindLabel="nome"
        bindValue="id"
        [ngModel]="filtros.usuarioId || null"
        (ngModelChange)="alterarUsuario($event ?? '')"
        placeholder="Todos os usuários"
        [clearable]="true"
        [searchable]="true"
      >
      </ng-select>
    </label>

    <label>
      <span>Componente</span>
      <ng-select
        [items]="componentesFiltro"
        [ngModel]="filtros.componente || null"
        (ngModelChange)="alterarComponente($event ?? '')"
        placeholder="Todos os componentes"
        [clearable]="true"
        [searchable]="true"
      >
      </ng-select>
    </label>

    <label>
      <span>Atividade principal</span>
      <ng-select
        [items]="atividadesPrincipaisFiltro"
        [ngModel]="filtros.atividadePrincipal || null"
        (ngModelChange)="alterarAtividadePrincipal($event ?? '')"
        placeholder="Todas as atividades"
        [disabled]="!filtros.componente"
        [clearable]="true"
        [searchable]="true"
      >
      </ng-select>
    </label>

    <label>
      <span>Subatividade</span>
      <ng-select
        [items]="subatividadesFiltro"
        [ngModel]="filtros.subatividade || null"
        (ngModelChange)="alterarSubatividade($event ?? '')"
        placeholder="Todas as subatividades"
        [disabled]="!filtros.componente || !filtros.atividadePrincipal"
        [clearable]="true"
        [searchable]="true"
      >
      </ng-select>
    </label>

    <app-periodo-filter
      [inicio]="filtros.inicio ?? ''"
      [fim]="filtros.fim ?? ''"
      (periodoChange)="alterarPeriodo($event)"
    ></app-periodo-filter>

    <div class="filter-actions">
      <button type="button" class="filter-clear-button" (click)="limpar()">
        Limpar
      </button>
    </div>
  </div>

  <div class="filter-helper">
    {{ helperText }}
  </div>
</section>
