<div class="login-page">
  <main class="login-content">
    <form class="login-card" (ngSubmit)="confirmar()">
      <div class="brand">
        <img src="/prosul_logo.jpeg" alt="Prosul" class="brand-logo" />
        <div>
          <h1>Prosul</h1>
          <p>Gestão que conecta equipes e projetos</p>
        </div>
      </div>

      <div class="intro">
        <h2>Defina sua <span>senha</span></h2>
        <p>Informe uma nova senha para concluir seu primeiro acesso</p>
      </div>

      <label class="field">
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="E-mail"
          required
          readonly
        />
      </label>

      <label class="field">
        <input
          type="password"
          name="novaSenha"
          [(ngModel)]="novaSenha"
          placeholder="Nova senha"
          required
          minlength="6"
        />
      </label>

      <label class="field">
        <input
          type="password"
          name="confirmacaoSenha"
          [(ngModel)]="confirmacaoSenha"
          placeholder="Confirmar nova senha"
          required
          minlength="6"
        />
      </label>

      <div class="alert alert-danger" *ngIf="error">
        {{ error }}
      </div>

      <div class="alert alert-success" *ngIf="success">
        {{ success }}
      </div>

      <button class="login-button" type="submit" [disabled]="loading || !!success">
        <span>{{ loading ? 'Alterando...' : 'Alterar senha' }}</span>
        <span class="arrow">→</span>
      </button>

      <a class="back-link" routerLink="/login">Voltar para o login</a>
    </form>
  </main>

  <section class="login-visual" aria-hidden="true">
    <div class="blue-panel"></div>
  </section>
</div>
